<a [routerLink]="`/blog/${post.slug}`"
  class="group h-full overflow-hidden bg-dark-card border border-border flex flex-col transition-all duration-500"
  [class]="showStyle === 'grid'? 'rounded-3xl hover:border-border-light hover:-translate-y-1' : 'rounded-2xl hover:border-orange-500/30 md:flex-row'">
  <div
    class="relative w-full h-52 overflow-hidden before:absolute before:inset-0 before:to-transparent before:opacity-0 before:group-hover:opacity-100 before:transition-all"
    [class]="showStyle!=='grid'?'md:w-72 lg:w-80 md:h-auto shrink-0 before:bg-linear-to-t before:from-black/60 before:via-transparent before:duration-500':'before:bg-linear-to-l before:from-dark-card/50 before:duration-300'">
    <img [alt]="post.title" class="w-full h-full object-cover transition-all ease-out"
      [class]="showStyle === 'grid'?'group-hover:scale-110 duration-700':'group-hover:scale-105 duration-500'"
      [src]="post.image">
    @if(showStyle==='grid'){
    <span
      class="absolute top-4 right-4 z-10 px-3 py-1 bg-dark/80 backdrop-blur-sm text-white text-xs font-semibold rounded-full border border-border-light">
      {{post.category}}
    </span>
    }
  </div>
  <div class="p-6 flex flex-col justify-center flex-1">
    <div class="flex flex-wrap items-center gap-3 text-sm text-neutral-500 mb-3">
      @if(showStyle==='list'){
      <span
        class="px-3 py-1 bg-orange-500/10 text-orange-500 text-xs font-semibold rounded-full border border-orange-500/20">
        {{post.category}}
      </span>
      }
      <span class="flex items-center gap-1">
        <i class="fa-regular fa-clock"></i>
        {{post.readTime}}
      </span>
      @if(showStyle==='grid'){
      <span class="w-1 h-1 bg-neutral-600 rounded-full"></span>
      }
      <span>{{post.date}}</span>
    </div>
    <h3 class="text-xl font-bold text-white mb-3 group-hover:text-orange-500 transition-all duration-300 line-clamp-2"
      [class]="showStyle === 'grid'?'leading-tight':'lg:text-2xl'">
      {{post.title}}
    </h3>
    <p class="text-neutral-400 line-clamp-2 text-sm leading-relaxed" [class]="showStyle === 'grid'?'mb-5':'mb-4'">
      {{post.excerpt}}
    </p>
    <div class="flex items-center justify-between"
      [class]="showStyle === 'grid'?'pt-4 border-t border-border':'mt-auto'">
      <div class="flex items-center gap-3">
        <img [alt]="post.author.name" class="rounded-full object-cover ring-2 ring-border"
          [class]="showStyle === 'grid'?'w-9 h-9':'w-10 h-10'" [src]="post.author.avatar">
        <div>
          <p class="text-sm text-white" [class]="showStyle === 'grid'?'font-medium':'font-semibold'">
            {{post.author.name}}
          </p>
          <p class="text-xs text-neutral-500">{{post.author.role}}</p>
        </div>
      </div>
      @if(showStyle === 'grid'){
      <div
        class="w-8 h-8 rounded-full bg-orange-500/10 flex items-center justify-center group-hover:bg-orange-500 transition-all duration-300 border border-orange-500/20 group-hover:border-transparent text-orange-500 group-hover:text-white">
        <i class="fa-solid fa-angle-left"></i>
      </div>
      }@else {
      <div
        class="hidden sm:flex items-center gap-2 text-orange-500 font-semibold text-sm group-hover:gap-3 transition-all duration-300">
        اقرأ المقال
        <i class="fa-solid fa-arrow-left-long"></i>
      </div>
      }
    </div>
  </div>
</a>
