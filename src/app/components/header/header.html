<section class="relative flex items-center overflow-hidden bg-dark" [class]="sectionStyle">
  <div
    class="absolute inset-0 bg-[linear-gradient(rgba(38,38,38,0.5)_1px,transparent_1px),linear-gradient(90deg,rgba(38,38,38,0.5)_1px,transparent_1px)] bg-size-[60px_60px] pointer-events-none">
  </div>
  <div class="absolute top-20 left-10 w-72 h-72 bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-20 right-10 w-96 h-96 bg-yellow-500/5 rounded-full blur-3xl pointer-events-none"></div>
  <div
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-125 h-125 bg-orange-500/5 rounded-full blur-3xl pointer-events-none">
  </div>

  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
    <div class="text-center max-w-4xl mx-auto">
      <div class="badge-pulse ">
        <span>
          <ng-content select="[pingPoint]"></ng-content>
        </span>
        <span [class]="badgeStyle">{{badgeText}}</span>
      </div>
      <h1 class="font-bold text-white mb-6" [class]="titleStyle">
        <ng-content select="[title]"></ng-content>
      </h1>
      <p class="text-xl text-neutral-400 max-w-2xl mx-auto" [class]="descriptionStyle">
        {{description}}
      </p>

      <<ng-content></ng-content>

    </div>
  </div>
</section>
