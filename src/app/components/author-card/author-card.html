<div
  class="group bg-dark-card rounded-2xl p-6 text-center border border-border hover:border-orange-500/30 transition-all duration-300">
  <div class="relative inline-block mb-4">
    <img [src]="author.avatar" [alt]="author.name"
      class="w-24 h-2/4 rounded-full object-cover ring-4 ring-border group-hover:ring-orange-500/30 transition-all duration-300">
    <span
      class="absolute -bottom-1 -right-1 w-6 h-6 bg-orange-500 rounded-full border-2 border-dark-card flex justify-center items-center text-white text-[12px]">
      <i class="fa-solid fa-check"></i>
    </span>
  </div>
  <h3 class="text-lg font-bold text-white">{{author.name}}</h3>
  <p class="text-sm font-medium text-orange-500 mb-4">{{author.role}}</p>
  <div class="flex justify-center gap-3">
    <a href=""
      class="w-9 h-9 bg-border rounded-lg flex justify-center items-center text-neutral-500 hover:bg-orange-500 hover:text-white transition-all duration-300">
      <i class="fa-brands fa-x-twitter"></i>
    </a>
    <a href=""
      class="w-9 h-9 bg-border rounded-lg flex justify-center items-center text-neutral-500 hover:bg-neutral-700 hover:text-white transition-all duration-300">
      <i class="fa-brands fa-github"></i>
    </a>
    <a href=""
      class="w-9 h-9 bg-border rounded-lg flex justify-center items-center text-neutral-500 hover:bg-blue-600 hover:text-white transition-all duration-300">
      <i class="fa-brands fa-linkedin"></i>
    </a>
  </div>
</div>
