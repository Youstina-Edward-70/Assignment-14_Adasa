<section
  class="py-24 bg-dark relative overflow-hidden before:absolute before:top-0 before:right-0 before:w-1/3 before:h-full before:bg-linear-to-l before:from-orange-500/5 before:to-transparent">
  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-4">
      <div>
        <div class="badge-pulse mb-4">
          <span>
            <span></span>
            <span></span>
          </span>
          الأحدث
        </div>
        <h2 class="text-4xl tracking-tight md:text-5xl lg:text-6xl font-bold text-white">أحدث المقالات</h2>
        <p class="mt-4 text-lg leading-relaxed text-neutral-400 max-w-lg">محتوى جديد طازج من المطبعة</p>
      </div>
      <a class="group inline-flex items-center gap-2 text-orange-500 hover:text-orange-400 font-semibold text-xl transition-all duration-300"
        routerLink="/blog">
        عرض جميع المقالات
        <i class="fa-solid fa-arrow-left-long w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>
      </a>
    </div>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (post of newPosts; track post.id) {
      <app-article-card [post]="post" />
      }
    </div>
  </div>
</section>
