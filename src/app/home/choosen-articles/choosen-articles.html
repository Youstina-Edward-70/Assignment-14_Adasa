<section
  class="py-24 bg-dark relative overflow-hidden before:absolute before:top-0 before:right-0 before:w-1/3 before:h-full before:bg-linear-to-l before:from-orange-500/5 before:to-transparent">
  <div class="relative z-10 max-w-7xl myContainer">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-4">
      <div>
        <div class="badge-pulse mb-4">
          <span>
            <span></span>
            <span></span>
          </span>
          مميز
        </div>
        <h2 class="text-4xl tracking-tight md:text-5xl lg:text-6xl font-bold text-white">مقالات مختارة</h2>
        <p class="mt-4 text-lg leading-relaxed text-neutral-400 max-w-lg">محتوى منتقى لبدء رحلة تعلمك</p>
      </div>
      <a class="group inline-flex items-center gap-2 px-5 py-2.5 bg-linear-to-r from-orange-500 to-orange-600 text-white rounded-xl font-medium transition-all duration-300 hover:-translate-y-0.5"
        routerLink="/blog">
        عرض الكل
        <i class="fa-solid fa-angle-left w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>
      </a>
    </div>
    <div class="space-y-8">
      @for (post of posts; track post.id) {
      <div
        class="group relative bg-dark-card rounded-3xl overflow-hidden border border-border hover:border-orange-500/30 transition-all duration-500">
        <a class="block" [routerLink]="`/blog/${post.slug}`">
          <div class="grid md:grid-cols-2 gap-0">
            <div class="relative h-72 md:h-100 overflow-hidden">
              <img [alt]="post.title"
                class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out"
                [src]="post.image">
              <div
                class="absolute inset-0 bg-linear-to-t from-black/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500">
              </div>
              <div class="absolute top-4 right-4">
                <span
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-linear-to-r from-orange-500 to-yellow-500 text-white text-xs font-semibold rounded-full">
                  <i class="fa-solid fa-star w-3.5 h-3.5"></i>
                  مميز
                </span>
              </div>
            </div>
            <div class="p-8 md:p-10 flex flex-col justify-center bg-dark-card">
              <div class="flex items-center gap-3 mb-4">
                <span
                  class="px-3 py-1 bg-orange-500/10 text-orange-500 text-xs font-semibold rounded-full border border-orange-500/20">{{post.category}}</span>
                <span class="flex items-center gap-1 text-sm text-neutral-500">
                  <i class="fa-regular fa-clock w-4 h-4"></i>
                  {{post.readTime}}
                </span>
              </div>
              <h2
                class="text-2xl md:text-3xl font-bold text-white mb-4 group-hover:text-orange-500 transition-colors duration-300 leading-tight">
                {{post.title}}</h2>
              <p class="text-neutral-400 mb-6 line-clamp-3 leading-relaxed">
                {{post.excerpt}}
              </p>
              <div class="flex items-center justify-between mt-auto">
                <div class="flex items-center gap-3">
                  <div class="relative">
                    <img [alt]="post.author.name"
                      class="w-12 h-12 rounded-full object-cover ring-2 ring-border shadow-md"
                      [src]="post.author.avatar">
                    <div
                      class="absolute -bottom-1 -left-1 w-4 h-4 bg-orange-500 rounded-full border-2 border-dark-card">
                    </div>
                  </div>
                  <div>
                    <p class="text-sm font-semibold text-white">{{post.author.name}}</p>
                    <p class="text-xs text-neutral-500">{{post.date}}</p>
                  </div>
                </div>
                <span
                  class="inline-flex items-center gap-2 text-orange-500 font-semibold text-sm group-hover:gap-3 transition-all duration-300">
                  اقرأ المقال
                  <i class="fa-solid fa-arrow-left"></i>
                </span>
              </div>
            </div>
          </div>
        </a>
      </div>
      }
    </div>
  </div>
</section>
