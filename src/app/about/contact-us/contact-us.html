<section class="py-20 bg-linear-to-br from-orange-600 via-orange-500 to-yellow-500">
  <div class="max-w-4xl myContainer text-center">
    <h2 class="text-3xl md:text-4xl font-bold text-white mb-6">لديك أسئلة؟ دعنا نتحدث!</h2>
    <p class="text-lg text-white/80 max-w-2xl mx-auto mb-8">
      نحب أن نسمع منك. سواء كان لديك سؤال حول محتوانا، أو تريد المساهمة، أو تريد فقط إلقاء التحية، لا تتردد في التواصل.
    </p>
    <div class="flex flex-col sm:flex-row justify-center gap-4">
      <a [href]="`mailto:${email}`"
        class="px-8 py-4 font-semibold rounded-xl text-white bg-dark hover:bg-neutral-900 hover:-translate-y-0.5 inline-flex items-center justify-center gap-2 transition-all duration-300">
        <i class="fa-regular fa-envelope"></i>
        تواصل معنا
      </a>
      <a routerLink="/blog"
        class="px-8 py-4 font-semibold rounded-xl text-white bg-transparent border border-white/40 hover:bg-white hover:text-dark transition-all duration-300">
        تصفح المقالات
      </a>
    </div>
  </div>
</section>
